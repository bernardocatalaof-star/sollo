<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Sollo</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container narrow login-box">
    <h1>Sollo</h1>
    {% if error %}<div class="notice error">Palavra-passe errada.</div>{% endif %}
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="next" value="{{ next }}" />
      <input type="password" name="password" placeholder="Palavra-passe" autofocus required autocomplete="current-password" />
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
